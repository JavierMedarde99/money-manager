components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    body_login:
      type: object
      properties:
        username:
          type: string
          example: user
        password:
          type: string
          example: 1234
    login_success:
      type: object
      properties:
        token_type:
          type: string
          example: Bearer
        access_token:
          type: string
          example: token
        expires_in:
          type: integer
          example: 18000
    errors:
      type: object
      properties:
        code:
          type: string
          example: error
        message:
          type: string
          example: error
    user:
      type: object
      properties:
        id:
          type: integer
          example: 1
        username:
          type: string
          example: username
        password:
          type: string
          example: password
        email:
          type: string
          example: email@gmail.com
    categories:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: videogames
        color:
          type: string
          example: FFFFFF
    transaction:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: name
        transaction_date:
          type: string
          example: "11-12-1999"
        amount:
          type: integer
          example: 2
        price:
          type: number
          example: 10.50
        transaction_type:
          type: string
          example: income
          description: "Enum that only is income or expenses"
        transaction_subtype:
          type: string
          example: variable
          description: "Enum that only is fixed or variable"
        category:
          type: object
          $ref: "#/components/schemas/categories"
    debts:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          description: name
        total_amount:
          type: number 
          description: 10000,29
        start_date:
          type: string
          description: "11-12-1999"
        end_date:
          type: string
          description: "13-12-2000"
    payments:
      type: object
      properties: 
        id:
          type: integer
          example: 1
        payments_date:
          type: string
          example: "20-10-1999"
        amount:
          type: number
          example: 200,45
        debt:
          type: object
          $ref: "#/components/schemas/debts"

security:
  - bearerAuth : []
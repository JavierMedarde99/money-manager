spring.application.name=manager

jwt.expiration=${JWT_EXPIRATION:30}
jwt.issuer=${JWT_ISSUER:manager}
jwt.audience=${JWT_AUDIENCE:money-manager-frontend}
jwt.key=${JWT_KEY:97a5dc453a718030001182a394b8d3d2756aa5e7}

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/money_manager}
